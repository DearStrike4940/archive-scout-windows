name: Build Windows x64 App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify Tkinter and trust store
        run: python -c "import tkinter, truststore; print('GUI and trust store ready')"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows package
        shell: powershell
        run: ./scripts/build_windows.ps1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveScout-Windows-x64
          path: |
            release/ArchiveScout-Windows-x64.zip
            release/ArchiveScout-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/ArchiveScout-Windows-x64.zip release/ArchiveScout-Windows-x64.zip.sha256 --clobber
          else
            gh release create "$TAG" release/ArchiveScout-Windows-x64.zip release/ArchiveScout-Windows-x64.zip.sha256 --title "Archive Scout $TAG" --generate-notes
          fi
