[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-scout"
version = "1.2.0"
description = "A resumable desktop tool for searching, downloading, and keyword-scanning public Wayback Machine captures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["truststore==0.10.4"]
license = {text = "MIT"}
authors = [{name = "Archive Scout contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Other Environment",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.scripts]
archive-scout = "archive_scout.cli:main"
archive-scout-gui = "archive_scout.app:main"

[tool.setuptools]
packages = ["archive_scout"]
